<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本列島 マップエディタ</title>
    <style>
        :root {
            --bg-color: #1e1e24;
            --panel-bg: #2d2d34;
            --text-color: #f5f5f5;
            --accent-color: #007acc;
            --border-color: #444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hiragino Sans', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* サイドバー（操作パネル） */
        #control-panel {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 10px;
            transition: background 0.2s;
            text-align: center;
        }

        .btn:hover {
            background-color: #005999;
        }

        .btn-secondary {
            background-color: #555;
        }
        .btn-secondary:hover {
            background-color: #444;
        }

        /* トグル状態用のスタイル */
        .btn-active {
            background-color: #4caf50 !important;
            border: 1px solid #388e3c;
        }
        .btn-active:hover {
            background-color: #388e3c !important;
        }

        /* 各都道府県追加ボタンのリスト */
        #pref-list-container {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 15px;
            border: 1px solid var(--border-color);
            background: #151518;
            padding: 10px;
            border-radius: 4px;
        }

        .pref-list-title {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 8px;
        }

        .pref-add-btn {
            display: block;
            width: 100%;
            background: #25252b;
            color: #ccc;
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            text-align: left;
            margin-bottom: 5px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .pref-add-btn:hover {
            background: var(--accent-color);
            color: white;
        }

        .pref-add-btn.placed {
            border-left: 4px solid #4caf50;
            background: #2d372e;
        }

        /* 選択中のパーツの微調整用インプット */
        #properties-panel {
            background: #151518;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
        }

        .prop-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .prop-row input {
            width: 70px;
            background: #25252b;
            border: 1px solid var(--border-color);
            color: white;
            padding: 3px 5px;
            border-radius: 3px;
            text-align: center;
        }

        /* 編集エリア */
        #editor-workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background-image: radial-gradient(#2d2d34 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: hidden;
        }

        #workspace-header {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 12px 18px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 5;
            border: 1px solid var(--border-color);
        }

        /* 枠固定の外側キャンバス */
        #map-canvas-viewport {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        #map-canvas-viewport:active {
            cursor: grabbing;
        }

        /* 下敷き画像サイズに合わせて動的に拡大縮小するマップボード */
        #map-board {
            position: absolute;
            width: 900px;  /* 初期値 */
            height: 520px; /* 初期値 */
            background-color: #151518;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            transform-origin: 0 0;
            border: 2px solid #555;
        }

        /* 下敷き画像：不透明度10% */
        #base-map-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            font-size: 1.5rem;
            opacity: 0.1;
        }

        /* 配置された都道府県パーツ */
        .map-part {
            position: absolute;
            cursor: move;
            border: 1px dashed rgba(255, 255, 255, 0.4);
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            background-color: rgba(0, 122, 204, 0.15);
            color: rgba(255, 255, 255, 0.8);
            transition: opacity 0.15s ease;
            opacity: 1.0;
        }

        /* 半透明表示トグルがONの時 */
        .map-part.semi-transparent {
            opacity: 0.5;
        }

        .map-part img {
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: block;
        }

        .map-part.selected {
            border: 2px solid #ff9800;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
            z-index: 100;
            background-color: rgba(255, 152, 0, 0.2);
            opacity: 1.0 !important;
        }
        .map-part.semi-transparent.selected {
            opacity: 0.8 !important;
        }

        /* インポート用の非表示ファイル入力 */
        #file-input {
            display: none;
        }

        /* ステータスバー */
        #editor-status {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            pointer-events: none;
            z-index: 5;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- 操作パネル -->
    <div id="control-panel">
        <h2>マップエディタ</h2>
        
        <div id="properties-panel">
            <div style="font-weight: bold; margin-bottom: 10px; color: #ff9800;">選択中のパーツ</div>
            <div id="selected-name" style="margin-bottom: 10px; font-size: 1rem;">なし</div>
            <div class="prop-row">
                <label>X座標 (left):</label>
                <input type="number" id="prop-x" value="0">
            </div>
            <div class="prop-row">
                <label>Y座標 (top):</label>
                <input type="number" id="prop-y" value="0">
            </div>
            <div class="prop-row">
                <label>横幅 (width):</label>
                <input type="number" id="prop-w" value="100">
            </div>
            <div class="prop-row">
                <label>縦幅 (height):</label>
                <input type="number" id="prop-h" value="100">
            </div>
            <button class="btn btn-secondary" onclick="removeSelected()" style="width: 100%; margin-top: 5px; font-size: 0.8rem; padding: 5px;">このパーツを外す</button>
        </div>

        <!-- 半透明トグル切り替えボタン -->
        <button id="btn-opacity-toggle" class="btn btn-secondary" onclick="togglePartsOpacity()" style="margin-bottom: 5px;">パーツ半透明: オフ</button>
        
        <!-- JSとJSONを同時に書き出すボタンに変更 -->
        <button class="btn" onclick="exportDataFiles()" style="background-color: #4caf50;">JS / JSONを書き出す</button>
        <button class="btn btn-secondary" onclick="triggerImport()" style="margin-top: 10px; font-size: 0.8rem;">JSON(以前のセーブ)読込</button>
        <input type="file" id="file-input" accept=".json, .js" onchange="importJSON(event)">

        <div class="pref-list-title" style="margin-top: 15px;">都道府県を追加 (クリックで配置)</div>
        <div id="pref-list-container">
            <!-- JSで47都道府県のボタン生成 -->
        </div>
    </div>

    <!-- 編集ワークスペース -->
    <div id="editor-workspace">
        <div id="workspace-header">
            <h3 style="font-size: 1rem;">ベースサイズ: <span id="board-size-display">900x520</span></h3>
            <p style="font-size: 0.75rem; color: #aaa; margin-top: 6px; line-height: 1.4;">
                【パーツ操作】: ドラッグで配置 / 矢印キーで1px微調整 (Shiftで10px)<br>
                【視点操作】: マウスホイールで拡縮 / スペース+左ドラッグ (または中ドラッグ) でスクロール
            </p>
        </div>

        <!-- 枠固定の外側コンテナ -->
        <div id="map-canvas-viewport">
            <!-- 基準マップボード -->
            <div id="map-board">
                <!-- 下敷き（base_map.pngがあれば自動で等倍読み込みされます） -->
                <div id="base-map-layer">
                    <img id="base-map-image" src="image/base_map.png" alt="" style="width: 100%; height: 100%; object-fit: contain; display: block;" onerror="this.style.display='none'; document.getElementById('base-map-layer').innerText = '【image/base_map.png を配置してください】'">
                </div>
                <!-- 都道府県パーツがここに動的配置される -->
            </div>
        </div>

        <!-- ズーム倍率等のステータス表示 -->
        <div id="editor-status">
            ズーム: <span id="zoom-display">100</span>%
        </div>
    </div>

    <script>
        // 47都道府県の定義
        const ALL_PREFECTURES = [
            { id: "hokkaido", name: "北海道" },
            { id: "aomori", name: "青森県" },
            { id: "iwate", name: "岩手県" },
            { id: "miyagi", name: "宮城県" },
            { id: "akita", name: "秋田県" },
            { id: "yamagata", name: "山形県" },
            { id: "fukushima", name: "福島県" },
            { id: "ibaraki", name: "茨城県" },
            { id: "tochigi", name: "栃木県" },
            { id: "gunma", name: "群馬県" },
            { id: "saitama", name: "埼玉県" },
            { id: "chiba", name: "千葉県" },
            { id: "tokyo", name: "東京都" },
            { id: "kanagawa", name: "神奈川県" },
            { id: "niigata", name: "新潟県" },
            { id: "toyama", name: "富山県" },
            { id: "ishikawa", name: "石川県" },
            { id: "fukui", name: "福井県" },
            { id: "yamanashi", name: "山梨県" },
            { id: "nagano", name: "長野県" },
            { id: "gifu", name: "岐阜県" },
            { id: "shizuoka", name: "静岡県" },
            { id: "aichi", name: "愛知県" },
            { id: "mie", name: "三重県" },
            { id: "shiga", name: "滋賀県" },
            { id: "kyoto", name: "京都府" },
            { id: "osaka", name: "大阪府" },
            { id: "hyogo", name: "兵庫県" },
            { id: "nara", name: "奈良県" },
            { id: "wakayama", name: "和歌山県" },
            { id: "tottori", name: "鳥取県" },
            { id: "shimane", name: "島根県" },
            { id: "okayama", name: "岡山県" },
            { id: "hiroshima", name: "広島県" },
            { id: "yamaguchi", name: "山口県" },
            { id: "tokushima", name: "徳島県" },
            { id: "kagawa", name: "香川県" },
            { id: "ehime", name: "愛媛県" },
            { id: "kochi", name: "高知県" },
            { id: "fukuoka", name: "福岡県" },
            { id: "saga", name: "佐賀県" },
            { id: "nagasaki", name: "長崎県" },
            { id: "kumamoto", name: "熊本県" },
            { id: "oita", name: "大分県" },
            { id: "miyazaki", name: "宮崎県" },
            { id: "kagoshima", name: "鹿児島県" },
            { id: "okinawa", name: "沖縄県" }
        ];

        // 現在配置されている都道府県の位置データ
        let placedParts = {};
        let selectedId = null;
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };

        // ボード全体のズーム・パン（移動）データ
        let zoomScale = 1.0;
        let boardPos = { x: 50, y: 50 };
        let isPanning = false;
        let panStart = { x: 0, y: 0 };
        let panOrigin = { x: 0, y: 0 };
        let isSpacePressed = false;

        // ボード（下敷き）の本来の等倍サイズ
        let boardSize = { w: 900, h: 520 };

        // グローバルな不透明度トグル状態
        let isSemiTransparentMode = false;

        window.addEventListener('DOMContentLoaded', () => {
            renderPrefButtons();
            setupInputListeners();
            setupKeyboardControls();
            setupBaseMapAutosize();
            setupZoomAndPan();
            
            document.addEventListener('mouseup', () => { 
                isDragging = false; 
                isPanning = false;
            });
        });

        function setupBaseMapAutosize() {
            const img = document.getElementById('base-map-image');
            
            const onBaseMapLoad = () => {
                boardSize.w = img.naturalWidth;
                boardSize.h = img.naturalHeight;
                
                const board = document.getElementById('map-board');
                board.style.width = `${boardSize.w}px`;
                board.style.height = `${boardSize.h}px`;

                document.getElementById('board-size-display').innerText = `${boardSize.w}x${boardSize.h}`;
                centerBoard();
            };

            if (img.complete) {
                onBaseMapLoad();
            } else {
                img.onload = onBaseMapLoad;
            }
        }

        function centerBoard() {
            const viewport = document.getElementById('map-canvas-viewport');
            const vw = viewport.clientWidth;
            const vh = viewport.clientHeight;
            
            boardPos.x = (vw - boardSize.w * zoomScale) / 2;
            boardPos.y = (vh - boardSize.h * zoomScale) / 2;
            
            updateBoardTransform();
        }

        function setupZoomAndPan() {
            const viewport = document.getElementById('map-canvas-viewport');

            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                
                const zoomFactor = 1.1;
                const rect = viewport.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const boardMouseX = (mouseX - boardPos.x) / zoomScale;
                const boardMouseY = (mouseY - boardPos.y) / zoomScale;

                if (e.deltaY < 0) {
                    zoomScale = Math.min(5.0, zoomScale * zoomFactor);
                } else {
                    zoomScale = Math.max(0.15, zoomScale / zoomFactor);
                }

                boardPos.x = mouseX - boardMouseX * zoomScale;
                boardPos.y = mouseY - boardMouseY * zoomScale;

                updateBoardTransform();
                document.getElementById('zoom-display').innerText = Math.round(zoomScale * 100);
            }, { passive: false });

            viewport.addEventListener('mousedown', (e) => {
                if (e.button === 1 || (e.button === 0 && isSpacePressed)) {
                    e.preventDefault();
                    isPanning = true;
                    panStart.x = e.clientX;
                    panStart.y = e.clientY;
                    panOrigin.x = boardPos.x;
                    panOrigin.y = boardPos.y;
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPanning) return;
                
                const dx = e.clientX - panStart.x;
                const dy = e.clientY - panStart.y;

                boardPos.x = panOrigin.x + dx;
                boardPos.y = panOrigin.y + dy;

                updateBoardTransform();
            });
        }

        function updateBoardTransform() {
            const board = document.getElementById('map-board');
            if (board) {
                board.style.transform = `translate(${boardPos.x}px, ${boardPos.y}px) scale(${zoomScale})`;
            }
        }

        function renderPrefButtons() {
            const container = document.getElementById('pref-list-container');
            container.innerHTML = '';
            
            ALL_PREFECTURES.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'pref-add-btn';
                btn.id = `btn-add-${p.id}`;
                btn.innerText = `${p.name}`;
                btn.onclick = () => addPrefToCanvas(p.id);
                container.appendChild(btn);
            });
        }

        function addPrefToCanvas(id, presetWidth = null, presetHeight = null) {
            if (placedParts[id]) {
                selectPart(id);
                return;
            }

            const ref = ALL_PREFECTURES.find(p => p.id === id);
            
            placedParts[id] = {
                id: id,
                name: ref.name,
                x: Math.round(boardSize.w / 2 - 50),
                y: Math.round(boardSize.h / 2 - 40),
                w: presetWidth || 100,
                h: presetHeight || 80,
                hasCustomSize: (presetWidth !== null)
            };

            createPartElement(placedParts[id]);
            selectPart(id);
            updateButtonStatus(id, true);
        }

        function createPartElement(data) {
            const board = document.getElementById('map-board');
            const el = document.createElement('div');
            el.className = 'map-part';
            el.id = `part-${data.id}`;
            
            if (isSemiTransparentMode) {
                el.classList.add('semi-transparent');
            }
            
            const img = document.createElement('img');
            img.src = `image/parts/${data.id}.png`;
            
            img.onload = () => {
                if (!data.hasCustomSize) {
                    data.w = img.naturalWidth;
                    data.h = img.naturalHeight;
                }
                
                updateElementPosition(data.id);
                if (selectedId === data.id) {
                    updatePropertiesUI();
                }
            };

            img.onerror = () => {
                img.style.display = 'none';
                el.innerText = data.name;
                
                if (!data.hasCustomSize) {
                    data.w = 100;
                    data.h = 80;
                }
                updateElementPosition(data.id);
            };
            
            el.appendChild(img);
            board.appendChild(el);

            updateElementPosition(data.id);

            el.addEventListener('mousedown', (e) => {
                if (e.button === 0 && !isSpacePressed) {
                    e.stopPropagation();
                    selectPart(data.id);
                    isDragging = true;
                    
                    const rect = el.getBoundingClientRect();
                    dragOffset.x = (e.clientX - rect.left) / zoomScale;
                    dragOffset.y = (e.clientY - rect.top) / zoomScale;
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging || selectedId !== data.id) return;
                
                const boardRect = board.getBoundingClientRect();
                let nx = (e.clientX - boardRect.left) / zoomScale - dragOffset.x;
                let ny = (e.clientY - boardRect.top) / zoomScale - dragOffset.y;

                nx = Math.max(0, Math.min(boardSize.w - placedParts[data.id].w, nx));
                ny = Math.max(0, Math.min(boardSize.h - placedParts[data.id].h, ny));

                placedParts[data.id].x = Math.round(nx);
                placedParts[data.id].y = Math.round(ny);

                updateElementPosition(data.id);
                updatePropertiesUI();
            });
        }

        function updateElementPosition(id) {
            const el = document.getElementById(`part-${id}`);
            const data = placedParts[id];
            if (el && data) {
                el.style.left = `${data.x}px`;
                el.style.top = `${data.y}px`;
                el.style.width = `${data.w}px`;
                el.style.height = `${data.h}px`;
            }
        }

        function selectPart(id) {
            selectedId = id;
            document.querySelectorAll('.map-part').forEach(el => el.classList.remove('selected'));
            
            const el = document.getElementById(`part-${id}`);
            if (el) {
                el.classList.add('selected');
            }

            const data = placedParts[id];
            document.getElementById('selected-name').innerText = data.name;
            document.getElementById('selected-name').style.color = '#ff9800';
            
            updatePropertiesUI();
        }

        function removeSelected() {
            if (!selectedId) return;
            
            const el = document.getElementById(`part-${selectedId}`);
            if (el) el.remove();
            
            updateButtonStatus(selectedId, false);
            delete placedParts[selectedId];
            
            selectedId = null;
            document.getElementById('selected-name').innerText = 'なし';
            document.getElementById('selected-name').style.color = '#fff';
            document.getElementById('prop-x').value = 0;
            document.getElementById('prop-y').value = 0;
            document.getElementById('prop-w').value = 100;
            document.getElementById('prop-h').value = 100;
        }

        function updateButtonStatus(id, isPlaced) {
            const btn = document.getElementById(`btn-add-${id}`);
            if (btn) {
                if (isPlaced) {
                    btn.classList.add('placed');
                } else {
                    btn.classList.remove('placed');
                }
            }
        }

        function togglePartsOpacity() {
            isSemiTransparentMode = !isSemiTransparentMode;
            const btn = document.getElementById('btn-opacity-toggle');
            
            if (isSemiTransparentMode) {
                btn.innerText = "パーツ半透明: オン";
                btn.classList.add('btn-active');
                document.querySelectorAll('.map-part').forEach(el => {
                    el.classList.add('semi-transparent');
                });
            } else {
                btn.innerText = "パーツ半透明: オフ";
                btn.classList.remove('btn-active');
                document.querySelectorAll('.map-part').forEach(el => {
                    el.classList.remove('semi-transparent');
                });
            }
        }

        function updatePropertiesUI() {
            if (!selectedId || !placedParts[selectedId]) return;
            const data = placedParts[selectedId];
            document.getElementById('prop-x').value = data.x;
            document.getElementById('prop-y').value = data.y;
            document.getElementById('prop-w').value = data.w;
            document.getElementById('prop-h').value = data.h;
        }

        function setupInputListeners() {
            const inputs = ['prop-x', 'prop-y', 'prop-w', 'prop-h'];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('input', () => {
                    if (!selectedId || !placedParts[selectedId]) return;
                    
                    const val = parseInt(document.getElementById(id).value) || 0;
                    if (id === 'prop-x') placedParts[selectedId].x = val;
                    if (id === 'prop-y') placedParts[selectedId].y = val;
                    if (id === 'prop-w') {
                        placedParts[selectedId].w = Math.max(5, val);
                        placedParts[selectedId].hasCustomSize = true;
                    }
                    if (id === 'prop-h') {
                        placedParts[selectedId].h = Math.max(5, val);
                        placedParts[selectedId].hasCustomSize = true;
                    }
                    
                    updateElementPosition(selectedId);
                });
            });
        }

        function setupKeyboardControls() {
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    isSpacePressed = true;
                    document.getElementById('map-canvas-viewport').style.cursor = 'grab';
                }

                if (!selectedId || !placedParts[selectedId]) return;
                if (document.activeElement.tagName === 'INPUT') return;

                const step = e.shiftKey ? 10 : 1;
                let keyRecognized = false;

                switch(e.key) {
                    case 'ArrowUp':
                        placedParts[selectedId].y = Math.max(0, placedParts[selectedId].y - step);
                        keyRecognized = true;
                        break;
                    case 'ArrowDown':
                        placedParts[selectedId].y = Math.min(boardSize.h - placedParts[selectedId].h, placedParts[selectedId].y + step);
                        keyRecognized = true;
                        break;
                    case 'ArrowLeft':
                        placedParts[selectedId].x = Math.max(0, placedParts[selectedId].x - step);
                        keyRecognized = true;
                        break;
                    case 'ArrowRight':
                        placedParts[selectedId].x = Math.min(boardSize.w - placedParts[selectedId].w, placedParts[selectedId].x + step);
                        keyRecognized = true;
                        break;
                    case 'Delete':
                    case 'Backspace':
                        removeSelected();
                        keyRecognized = true;
                        break;
                }

                if (keyRecognized) {
                    e.preventDefault();
                    updateElementPosition(selectedId);
                    updatePropertiesUI();
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'Space') {
                    isSpacePressed = false;
                    document.getElementById('map-canvas-viewport').style.cursor = 'default';
                }
            });
        }

        // 12. JSとJSONの両方のファイルを同時に書き出す機能
        function exportDataFiles() {
            if (Object.keys(placedParts).length === 0) {
                alert("パーツが何も配置されていません。");
                return;
            }

            const exportData = {};
            for (let id in placedParts) {
                exportData[id] = {
                    x: placedParts[id].x,
                    y: placedParts[id].y,
                    w: placedParts[id].w,
                    h: placedParts[id].h
                };
            }

            const jsonString = JSON.stringify(exportData, null, 2);
            
            // 1. 本番ゲーム読み込み用の JS ファイル生成とダウンロード
            const jsString = `// 自動生成された位置調整データ\nconst PREFECTURE_POSITIONS = ${jsonString};\n`;
            downloadFile(jsString, "application/javascript", "prefecture_positions.js");
            
            // 2. エディタ再読み込み・バックアップ用の JSON ファイル生成とダウンロード
            setTimeout(() => {
                downloadFile(jsonString, "application/json", "prefecture_positions.json");
            }, 300); // 同時ダウンロードブロックを避けるためのわずかな遅延
        }

        // ファイルダウンロード処理の共通関数
        function downloadFile(content, mimeType, fileName) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function triggerImport() {
            document.getElementById('file-input').click();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let content = e.target.result;
                    
                    if (content.includes("const PREFECTURE_POSITIONS =")) {
                        content = content.replace(/const PREFECTURE_POSITIONS\s*=\s*/, "").replace(/;$/, "");
                    }

                    const importedData = JSON.parse(content);
                    
                    document.querySelectorAll('.map-part').forEach(el => el.remove());
                    placedParts = {};
                    selectedId = null;
                    document.getElementById('selected-name').innerText = 'なし';
                    renderPrefButtons();

                    for (let id in importedData) {
                        const ref = ALL_PREFECTURES.find(p => p.id === id);
                        if (ref) {
                            addPrefToCanvas(id, importedData[id].w, importedData[id].h);
                            placedParts[id].x = importedData[id].x;
                            placedParts[id].y = importedData[id].y;
                            updateElementPosition(id);
                        }
                    }

                    alert("位置データを正常にインポートしました！再調整を始められます。");

                } catch(err) {
                    alert("ファイルの解析に失敗しました。正しい位置ファイルを選択してください。" + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
    </script>
